spring.application.name=catvet
# Tests run against an in-memory H2 database, NOT the prod Postgres.
# This file shadows src/main/resources/application.properties on the test classpath,
# so spring.profiles.active=prod does not apply here.
spring.datasource.url=jdbc:h2:mem:catvet-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
